<title>Processo do contas a pagar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { color-scheme: light; --black: #030202; --brand: #df285d; --ink: #171717; --line: #d4d4d4; }
__DIAGRAM_CSS__
html, body { height: 100%; }
body { background: #f9f9f9; color: var(--ink); font: 16px "Inter", system-ui, sans-serif; display: flex; flex-direction: column; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--black); border-bottom: 5px solid var(--brand);
  padding: 14px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px)); }
.bar button { font: 600 16px "Inter", system-ui, sans-serif; background: transparent; color: #fefefe; border: 2px solid #404040;
  border-radius: 8px; padding: 8px 16px; cursor: pointer; }
.bar button:hover { border-color: var(--brand); }
.bar button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); }
.bar button:focus-visible { outline: 3px solid #fbcad3; outline-offset: 2px; }
.bar .gap { flex: 1; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 15px; font-weight: 500; color: #fefefe; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 18px; height: 18px; border-radius: 4px; border: 2.5px solid; display: inline-block; }
#canvas { flex: 1; min-height: 0; position: relative; background: #fefefe; }
#canvas .djs-label, #canvas text { font-family: "Inter", system-ui, sans-serif !important; }
#canvas [data-element-id^="Lane_"] .djs-label, #canvas [data-element-id^="Part_"] .djs-label { display: none; }
.opp { width: 270px; background: #fefefe; border: 2.5px solid #df285d; border-radius: 10px; padding: 10px 12px; font: 500 14px/1.4 "Inter", system-ui, sans-serif; color: #171717; box-shadow: 0 2px 0 #fbcad3; pointer-events: none; }
.opp.narrow { width: 220px; }
.opp b { display: block; color: #df285d; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.djs-element.agent-candidate .djs-visual > rect { stroke: #df285d !important; stroke-width: 5px !important; }
.lane-label { font: 700 15px "Inter", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: #404040; white-space: nowrap; pointer-events: none; }
</style>

<div class="bar">
  <button type="button" data-show="target" aria-pressed="true">Processo-alvo</button>
  <button type="button" data-show="current" aria-pressed="false">Processo atual</button>
  <span class="gap"></span>
  <div class="legend" aria-label="Legenda das cores">
    <span><i style="background:#e1f7ff;border-color:#00749e"></i>Sistema</span>
    <span><i style="background:#fdf0f4;border-color:#df285d"></i>Agente</span>
    <span><i style="background:#fff0db;border-color:#e68619"></i>Pessoa</span>
    <span><i style="background:#d2fff1;border-color:#12805c"></i>Segue para pagar</span>
    <span><i style="background:#f7e0e0;border-color:#c62828"></i>Bloqueio ou perda</span>
    <span><i style="background:#fefefe;border-color:#df285d;border-width:4px"></i>Onde um agente pode entrar</span>
  </div>
  <span class="gap"></span>
  <button type="button" data-zoom="1.2" aria-label="Aproximar">+</button>
  <button type="button" data-zoom="0.8" aria-label="Afastar">−</button>
  <button type="button" data-fit>Ajustar</button>
  <button type="button" data-all>Ver tudo</button>
</div>
<div id="canvas"></div>

<script type="text/plain" id="xml-current">__XML_CURRENT__</script>
<script type="text/plain" id="xml-target">__XML_TARGET__</script>
<script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-navigated-viewer.production.min.js"></script>
<script>
const viewer = new BpmnJS({
  container: "#canvas",
  textRenderer: {
    defaultStyle: { fontFamily: "Inter, system-ui, sans-serif", fontSize: 15, fontWeight: 500 },
    externalStyle: { fontFamily: "Inter, system-ui, sans-serif", fontSize: 14 }
  }
});
function fitHeight() {
  const canvas = viewer.get("canvas");
  canvas.zoom("fit-viewport");
  const box = canvas.viewbox();
  const outer = box.outer;
  const inner = box.inner;
  const scale = Math.min(1.1, (outer.height - 24) / inner.height);
  canvas.zoom(scale, { x: inner.x, y: inner.y + inner.height / 2 });
  const vb = canvas.viewbox();
  canvas.viewbox({ x: inner.x - 10, y: inner.y - 10, width: vb.width, height: vb.height });
}
async function show(id) {
  document.querySelectorAll("[data-show]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.show === id)));
  await viewer.importXML(document.getElementById("xml-" + id).textContent.trim());
  const overlays = viewer.get("overlays");
  viewer.get("elementRegistry").filter((e) => e.type === "bpmn:Lane").forEach((lane) => {
    const label = document.createElement("div");
    label.className = "lane-label";
    label.textContent = lane.businessObject.name || "";
    overlays.add(lane.id, { position: { top: 10, left: 14 }, html: label });
  });
  addNotes(overlays);
  fitHeight();
}
const CANDIDATES = {
  Task_Classify: { kind: "Agente LLM", text: "Casar item com o cadastro e achar a ordem provável", pos: { top: -100, left: 12 } },
  Task_ProposeAction: { kind: "Agente LLM", text: "Escrever o dossiê da exceção para quem aprova", pos: { top: -100, left: 26 } },
  Task_Confirm: { kind: "Agente Clef + LLM", text: "Confirmar antes da doca com confiança calibrada; recomendar a alteração" },
  Task_ConfirmCount: { kind: "Agente Clef + LLM", text: "Confirmar com a contagem no banco: falta física e quantidade menor" },
  Task_Count: { kind: "Agente LLM com visão", text: "Contar o pallet pela foto, como contraponto ao operador" }
};
function addNotes(overlays) {
  const registry = viewer.get("elementRegistry");
  const canvas = viewer.get("canvas");
  Object.entries(CANDIDATES).forEach(([id, c]) => {
    if (!registry.get(id)) return;
    canvas.addMarker(id, "agent-candidate");
    const card = document.createElement("div");
    card.className = "opp";
    const kind = document.createElement("b");
    kind.textContent = c.kind;
    card.appendChild(kind);
    card.appendChild(document.createTextNode(c.text));
    if (c.pos) card.classList.add("narrow");
    overlays.add(id, { position: c.pos || { top: 86, left: -70 }, html: card });
  });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const canvas = viewer.get("canvas");
  if (b.dataset.show) show(b.dataset.show);
  if (b.dataset.zoom) canvas.zoom(canvas.zoom() * Number(b.dataset.zoom));
  if ("fit" in b.dataset) fitHeight();
  if ("all" in b.dataset) canvas.zoom("fit-viewport");
});
show("target");
</script>
