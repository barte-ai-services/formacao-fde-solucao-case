name: Provisiona o Cloudflare Access

# Disparo manual (#232). Atualiza a aplicação do Access que o Worker já usa, a do AUD em
# BARTE_ACADEMY_ACCESS_AUD, com a política que libera qualquer e-mail (decisão do CFO) e o código por e-mail
# como único provedor.
# Não cria aplicação: criar é pedido explícito do script (--create), à mão.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só mostra o que enviaria, sem gravar nada"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-access
  cancel-in-progress: false

jobs:
  provisionar:
    # Só a main grava: um disparo manual a partir de outra branch não chega à conta.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Token, conta e AUD entram pelo env e o script os lê de lá: nenhuma expressão do Actions na linha de
      # comando, e o script não imprime o token. O input de dry-run também entra pelo env.
      - name: Provisiona o Access
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/cloudflare_access.py --dry-run
          else
            python3 scripts/cloudflare_access.py
          fi
        env:
          BARTE_ACADEMY_CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
          BARTE_ACADEMY_ACCESS_AUD: ${{ vars.BARTE_ACADEMY_ACCESS_AUD }}
          DRY_RUN: ${{ inputs.dry_run }}
