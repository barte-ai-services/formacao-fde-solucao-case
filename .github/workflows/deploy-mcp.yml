name: Publica o Worker do MCP

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    # Só publica a main: um disparo manual a partir de outra branch não chega à produção.
    if: github.ref == 'refs/heads/main'
    # Os secrets BARTE_ACADEMY_* só existem no environment producao, que aceita só a main (#234).
    environment: producao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      # O Actions só publica: o MCP nunca roda aqui. Os testes rodam antes, sem rede e sem credencial.
      - run: python3 -m unittest discover -s mcp/src -p '*_test.py'
      # As dependências saem do lockfile (#272, SUP-1), num passo sem nenhum secret e sem scripts de instalação:
      # nenhum código de dependência roda aqui, e o que rodasse não veria as credenciais da Cloudflare.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mcp
      # Só este passo tem as credenciais, e roda o wrangler que o `npm ci` instalou, na versão travada.
      - run: npx wrangler deploy
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
