name: Publica o Worker do MCP

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    # Só publica a main: um disparo manual a partir de outra branch não chega à produção.
    if: github.ref == 'refs/heads/main'
    # Os secrets BARTE_ACADEMY_* só existem no environment producao, que aceita só a main (#234).
    environment: producao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # O Actions só publica: o MCP nunca roda aqui. Os testes rodam antes, sem rede e sem credencial.
      - run: python3 -m unittest discover -s mcp/src -p '*_test.py'
      - run: npx wrangler@4.156.0 deploy
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
