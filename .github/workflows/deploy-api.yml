name: Publica o Worker

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    # Só publica a main: um disparo manual a partir de outra branch não chega à produção.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # O AUD e o domínio do time do Access (#54) e a URL do Supabase (#59) são variáveis do
      # repositório, não segredos. Entram pelo env e são lidos no shell, sem expressão do Actions na
      # linha de comando. Vazios, o Worker sobe fechado: fora do /health, sem token responde 401 e com
      # token responde 503.
      - run: npx wrangler deploy --var "ACCESS_AUD:$ACCESS_AUD" --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "BARTE_ACADEMY_SUPABASE_URL:$BARTE_ACADEMY_SUPABASE_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_AUD: ${{ vars.BARTE_ACADEMY_ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.BARTE_ACADEMY_ACCESS_TEAM_DOMAIN }}
          BARTE_ACADEMY_SUPABASE_URL: ${{ vars.BARTE_ACADEMY_SUPABASE_URL }}
      # A chave secreta só existe no Worker: entra pela entrada padrão, sem aparecer no log nem no git (#59).
      - run: printf '%s' "$BARTE_ACADEMY_SUPABASE_SECRET_KEY" | npx wrangler secret put BARTE_ACADEMY_SUPABASE_SECRET_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
          BARTE_ACADEMY_SUPABASE_SECRET_KEY: ${{ secrets.BARTE_ACADEMY_SUPABASE_SECRET_KEY }}
